<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <!-- Gold / Yellow Orbiting Arc (Top) -->
    <path id="goldArc" d="M 105 135 C 105 45, 220 15, 345 55 C 385 68, 380 75, 365 72 C 255 38, 145 60, 135 125 C 133 138, 115 145, 105 135 Z" />
    
    <!-- Red Accent Arc (Middle Right / Crossing) -->
    <path id="redArc" d="M 280 82 C 345 80, 400 95, 420 120 C 430 132, 422 138, 412 130 C 392 110, 340 98, 280 98 C 265 98, 265 82, 280 82 Z" />

    <!-- Green Orbiting Arc (Bottom) -->
    <path id="greenArc" d="M 395 145 C 395 235, 280 265, 155 225 C 115 212, 120 205, 135 208 C 245 242, 355 220, 365 155 C 367 142, 385 135, 395 145 Z" />
    
    <!-- Red Tail Arc (Bottom Left Tip) -->
    <path id="redTail" d="M 125 140 C 95 145, 75 160, 60 178 C 52 188, 62 195, 70 185 C 85 168, 102 155, 125 150 C 132 148, 132 140, 125 140 Z" />
  </defs>

  <!-- Render Swooshes with exact brand colors -->
  <use href="#goldArc" fill="#E8B929" />
  <use href="#redArc" fill="#D32F2F" />
  <use href="#greenArc" fill="#0F8A53" />
  <use href="#redTail" fill="#D32F2F" />

  <!-- Typography Group -->
  <!-- "F&G" Bold, Modern Sans-Serif -->
  <text x="252" y="142" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#1A1A1A" text-anchor="middle" letter-spacing="-2">F&amp;G</text>
  
  <!-- "industrial" Regular/Medium Sans-Serif, lowercase, tracked out -->
  <text x="252" y="180" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="28" fill="#2C2C2C" text-anchor="middle" letter-spacing="4.5">industrial</text>
</svg>
